---
#
# Ansible managed
#

name: Ansible Molecule

on:
  push:
    branches:
      - master
      - main
      - codex
      - testing
  pull_request:
    branches:
      - master
      - main
      - codex
      - testing
  schedule:
    - cron: '29 15 15 * *'

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: ansible-lint
        uses: ansible/ansible-lint@v26.6.0

  molecule:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Only debian11 kept: OwnCloud 'classic' (the PHP-based server this
      # role installs) hard-rejects PHP 8.0+ in its own bootstrap code
      # (lib/base.php, confirmed in the latest stable release v10.16.3) -
      # a permanent vendor incompatibility, not a version-pinning bug.
      # debian11 is the only platform here still shipping PHP 7.4; every
      # other platform ships PHP 8.1+.
      matrix:
        distro:
          - image: "docker-molecule-images"
            tag: "debian11"
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          path: ansible-role-owncloud

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure Docker for systemd
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "features": {
              "buildkit": true
            },
            "exec-opts": ["native.cgroupdriver=systemd"]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true

      - name: Install Docker
        uses: docker/setup-buildx-action@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Test with molecule
        run: |
          cd ansible-role-owncloud
          molecule test
        env:
          PY_COLORS: 1
          ANSIBLE_FORCE_COLOR: 1
          ANSIBLE_ROLES_PATH: ~/.ansible/roles:${GITHUB_WORKSPACE}/ansible-role-owncloud
          image: ${{ matrix.distro.image }}
          tag: ${{ matrix.distro.tag }}
