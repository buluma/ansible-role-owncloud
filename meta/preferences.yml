---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
#
# EL, Fedora, and Ubuntu are excluded entirely, and Debian is pinned to 11
# only: OwnCloud 'classic' (the PHP-based server this role installs) hard-
# rejects PHP 8.0+ in its own bootstrap code (lib/base.php, confirmed in
# the latest stable release v10.16.3) - a permanent vendor incompatibility.
# debian11 is the only platform still shipping PHP 7.4.
platforms:
  - name: Debian
    versions:
      - "11"
