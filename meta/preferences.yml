---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
#
# This role now installs oCIS (ownCloud Infinite Scale) instead of ownCloud
# 'classic': a statically-linked Go binary with no PHP/Apache/MySQL/Redis
# dependency (see SHA-177 and defaults/main.yml), so it isn't tied to any
# particular platform's PHP version anymore. Matrix widened accordingly.
platforms:
  - name: EL
    versions:
      - "10"
      - "9"
  - name: Debian
    versions:
      - "13"
      - "12"
  - name: Fedora
    versions:
      # Excludes 45: it ships Python 3.15.0b3, whose dataclasses module
      # dropped _is_type, breaking ansible-core's AnsiballZ module wrapper.
      - "44"
      - "43"
  - name: Ubuntu
    versions:
      - all
