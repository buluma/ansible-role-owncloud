---
- name: Import assert.yml
  ansible.builtin.import_tasks: assert.yml
  delegate_to: localhost
  run_once: true

- name: Groupadd
  ansible.builtin.group:
    name: "{{ ocis_group }}"
    state: present
    system: true

- name: Useradd
  ansible.builtin.user:
    name: "{{ ocis_owner }}"
    group: "{{ ocis_group }}"
    home: "{{ ocis_data_path }}"
    create_home: false
    shell: "/usr/sbin/nologin"
    state: present
    system: true

- name: Prepare directories
  ansible.builtin.file:
    dest: "{{ item }}"
    owner: "{{ ocis_owner }}"
    group: "{{ ocis_group }}"
    mode: "0750"
    state: directory
  loop:
    - "{{ ocis_config_dir }}"
    - "{{ ocis_data_path }}"

- name: Download oCIS binary
  ansible.builtin.get_url:
    url: "{{ ocis_download.url }}"
    dest: "{{ ocis_binary_path }}"
    checksum: "{{ ocis_download.checksum }}"
    owner: root
    group: root
    mode: "0755"

- name: Place ocis.env
  ansible.builtin.template:
    dest: "{{ ocis_config_dir }}/ocis.env"
    src: ocis.env.j2
    owner: "{{ ocis_owner }}"
    group: "{{ ocis_group }}"
    mode: "0640"

- name: Initialize oCIS configuration
  # Runs as root, same as ownCloud's own documented systemd deployment
  # (docs/ocis/deployment/systemd.md in owncloud/ocis) - 'ocis init' itself
  # has no blocking I/O (no network calls, no prompts, just local random
  # password generation and a config file write), so there's nothing here
  # that should need become_user. async/poll is a hard timeout: if this
  # ever hangs again it fails fast instead of burning the whole job.
  ansible.builtin.command:
    cmd: "{{ ocis_binary_path }} init --config-path {{ ocis_config_dir }}"
    creates: "{{ ocis_config_dir }}/ocis.yaml"
  environment:
    IDM_ADMIN_PASSWORD: "{{ ocis_admin_pass }}"
  async: 120
  poll: 5
  no_log: true

- name: Fix ownership of oCIS config after init
  # 'ocis init' just ran as root and wrote ocis.yaml as root:root 0600 -
  # give it back to the ocis user/group so the systemd service (User=ocis)
  # can actually read it. Leaves the file modes 'ocis init' set alone.
  ansible.builtin.file:
    dest: "{{ ocis_config_dir }}"
    owner: "{{ ocis_owner }}"
    group: "{{ ocis_group }}"
    recurse: true
    state: directory

- name: Place ocis.service
  ansible.builtin.template:
    dest: /etc/systemd/system/ocis.service
    src: ocis.service.j2
    owner: root
    group: root
    mode: "0644"
  notify:
    - Ocis | systemctl daemon-reload
    - Ocis | systemctl restart ocis

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Systemctl start ocis
  ansible.builtin.service:
    name: ocis
    state: started
    enabled: true
